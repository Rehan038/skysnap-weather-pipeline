# Weather ETL — Docker Compose stack
# Airflow 3.3.2 (LocalExecutor) + MySQL 8 warehouse
#
# Quick start:
#   cp .env.example .env   # fill in every variable marked required (no built-in defaults)
#   docker compose up -d --build
#   open http://localhost:8080
#
# Every published port is bound to 127.0.0.1: Airflow has no login (ALL_ADMINS) and the
# Streamlit app can spend Gemini quota, so neither may be reachable from the network.

x-airflow-common: &airflow-common
  build: .
  image: weather-etl-airflow:latest
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:?set AIRFLOW__API_AUTH__JWT_SECRET in .env}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    PYTHONPATH: /opt/airflow/src
    WAREHOUSE_HOST: warehouse
    WAREHOUSE_PORT: "3306"
    WAREHOUSE_USER: weather
    WAREHOUSE_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    WAREHOUSE_DB: weather
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./logs:/opt/airflow/logs
    - ./tests:/opt/airflow/tests
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ── Airflow metadata database ──────────────────────────────────────────────
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # ── Airflow initialisation (runs once, then exits) ─────────────────────────
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - airflow db migrate
    restart: "no"

  # ── Airflow API server (UI + REST API) ─────────────────────────────────────
  airflow-apiserver:
    <<: *airflow-common
    command: airflow api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # ── Airflow scheduler ──────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # ── Airflow DAG processor ──────────────────────────────────────────────────
  airflow-dag-processor:
    <<: *airflow-common
    command: airflow dag-processor
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # ── MySQL 8 warehouse ──────────────────────────────────────────────────────
  warehouse:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: weather
      MYSQL_USER: weather
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      SKYSNAP_READER_PASSWORD: ${SKYSNAP_READER_PASSWORD:?set SKYSNAP_READER_PASSWORD in .env}
    ports:
      - "127.0.0.1:${WAREHOUSE_HOST_PORT:-3307}:3306"
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./sql/02-reader-user.sh:/docker-entrypoint-initdb.d/02-reader-user.sh:ro
      - ./sql/03-pipeline-grants.sh:/docker-entrypoint-initdb.d/03-pipeline-grants.sh:ro
      - warehouse-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysqladmin ping -h localhost -u weather"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # -- Ask SkySnap (Streamlit UI) ---------------------------------------------
  ask:
    build:
      context: .
      dockerfile: Dockerfile.ask
    image: skysnap-ask:latest
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      GEMINI_EMBED_MODEL: ${GEMINI_EMBED_MODEL}
      SKYSNAP_READER_PASSWORD: ${SKYSNAP_READER_PASSWORD:?set SKYSNAP_READER_PASSWORD in .env}
      READER_HOST: warehouse
      READER_PORT: "3306"
      INDEX_CACHE_PATH: /cache/ask_index.json
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ask-cache:/cache
    depends_on:
      warehouse:
        condition: service_healthy

volumes:
  postgres-data:
  warehouse-data:
  ask-cache:

